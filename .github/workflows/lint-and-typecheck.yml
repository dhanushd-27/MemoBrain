name: lint and check-types

on:
  pull_request:
    types:
      - opened
    branches:
      - prod

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: bun install
      - name: Run lint
        run: bun run lint
      - name: Run check-types
        run: bun run check-types
