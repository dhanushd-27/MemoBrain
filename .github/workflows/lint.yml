name: lint and type check

on:
  pull_request:
    branches:
      - feat/*
      - fix/*
      - main
      - production

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.4

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm lint
    
      - name: Type check
        run: pnpm type-check